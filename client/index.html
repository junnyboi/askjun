    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jun Boh",
      "jobTitle": "Senior Frontend / Full Stack Software Engineer",
      "url": "https://askjun.org",
      "sameAs": [
        "https://linkedin.com/in/junboh",
        "https://github.com/junnyboi"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Meta"
      },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "National University of Singapore" },
        { "@type": "CollegeOrUniversity", "name": "Eindhoven University of Technology" },
        { "@type": "CollegeOrUniversity", "name": "Singapore Management University" }
      ],
      "knowsAbout": ["React", "TypeScript", "AI Agent Interfaces", "Payment Systems", "Vue.js", "Python", "Golang"],
      "nationality": "Singaporean"
    }
    </script>
    <!-- Anti-flash: set theme + font scale class before render -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var fs = localStorage.getItem('askjun_font_scale');
        if (fs === 'large') document.documentElement.classList.add('font-large');
        else if (fs === 'xlarge') document.documentElement.classList.add('font-xlarge');
      })();
    </script>
    <!-- Nothing Typography: Space Grotesk (display), Inter (body), Space Mono (technical) -->
    <!-- Primary: self-hosted via @font-face in index.css (no render-blocking) -->
    <!-- Fallback: Google Fonts loaded async (non-render-blocking) in case storage proxy fails -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" /></noscript>
  </head>

  <body>
    <!-- Shown until the app has loaded; React replaces it when it mounts -->
    <style>
      .app-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; }
      .app-loading span { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #e60000; border-radius: 50%; animation: app-loading-spin 0.8s linear infinite; }
      .dark .app-loading { background: #0a0a0a; }
      .dark .app-loading span { border-color: #2a2a2a; border-top-color: #ff4d4d; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root"><div class="app-loading" data-app-loading role="status" aria-label="Loading askJun"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
